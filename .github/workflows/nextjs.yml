# .github/workflows/deploy.yml

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"] # Oder master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build with Next.js
        run: npm run build
        env:
          # NODE_ENV wird von Next.js build automatisch auf production gesetzt,
          # aber explizit schadet nicht.
          NODE_ENV: production
      - name: Static Export with Next.js
        run: npm run export
      # --- NEUER SCHRITT ---
      - name: Add CNAME file
        run: echo "er0r.de" > ./out/CNAME # Erstellt die CNAME-Datei im Output-Ordner
      # --- ENDE NEUER SCHRITT ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Der Pfad zum Ordner, der deployt werden soll
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4